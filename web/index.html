<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Cellphone Doctor - India's Trusted Mobile Service Centre. Professional repair solutions for smartphones, tablets, and laptops.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Cellphone Doctor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The CellPhone Doctor - Best Mobile Services Shop in All Over TamilNadu</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Hide reCAPTCHA badge on Web */
    .grecaptcha-badge {
      visibility: hidden !important;
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .app-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .app-logo {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #E2E8F0;
      border-top: 3.5px solid #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      margin-top: 14px;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app-loader" id="loading-indicator">
    <img src="assets/assets/Icon/Icon.png" class="app-logo" alt="The Cellphone Doctor Logo" onerror="this.onerror=null; this.src='icons/Icon-192.png';">
    <div class="spinner"></div>
    <div class="loader-text">Loading The CellPhone Doctor...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: cellphone_doctor
description: "The CellPhone Doctor"

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# App version
version: 60.0.0+60

# Dart SDK version
environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Management & Navigation

  cupertino_icons: ^1.0.8
  get: 4.7.3
  image_picker:
  flutter_screenutil: ^5.9.3
  persistent_bottom_nav_bar: ^6.2.1
  dash_curved_tab_bar: ^0.0.2
  video_player:
  chewie:
  shared_preferences:
  intl: ^0.18.0
  top_snackbar_flutter: ^3.3.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  skeletonizer: ^2.1.1
  google_maps_flutter: ^2.14.0
  geocoding: ^4.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  webview_flutter_android:
  webview_flutter_wkwebview:
  http:
  path_provider:
  permission_handler:
  video_thumbnail: ^0.5.3
  cached_network_image: ^3.4.1
  razorpay_flutter: ^1.4.1
  flutter_widget_from_html: ^0.17.1
  geolocator: ^14.0.2
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.2.3
  speech_to_text: ^7.3.0
  upgrader: ^10.3.0
  workmanager: ^0.9.0+3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Asset files
  assets:
    - assets/Icon/
    - assets/Splash_Video/
    - assets/cart_header/
    - assets/course/
    - assets/images/
    - assets/images/Brand/
    - assets/images/Process/
    - assets/images/bottom/
    - assets/images/category/
    - assets/images/did_u_know/
    - assets/images/modal/
    - assets/images/selectService/
    - assets/images/story/
    - assets/images/why_us/

  # Custom fonts (optional)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
